# Phase 1 daily fundamentals ingestion (DESIGN.md §5, §7).
#
# Switched from FMP to SEC EDGAR (2026-07-13) — FMP's free tier turned out
# to plan-gate ratios, key-metrics, AND income-statement for essentially
# every S&P 500 ticker (confirmed via live 402s). EDGAR is completely
# free, no plan tiers, ever — see src/providers/sec_edgar_provider.py's
# module docstring for the full story and tradeoffs.
#
# Deliberately workflow_dispatch-only for now, NOT scheduled — this is a
# newly-built provider (raw XBRL parsing, computed ratios rather than
# pre-computed ones) and hasn't been validated against a live run yet.
# Trigger manually, check stderr for any "WARNING: EDGAR fundamentals
# field ... was None for ALL" lines, and only add a `schedule:` block
# (matching price_ingestion_cron.yml) once a run comes back clean.
name: daily-fundamentals-ingestion

on:
  workflow_dispatch: {}
  # schedule:
  #   - cron: "45 13 * * *"   # uncomment once EDGAR provider is validated

jobs:
  ingest-fundamentals:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run fundamentals ingestion
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          SEC_EDGAR_USER_AGENT: ${{ secrets.SEC_EDGAR_USER_AGENT }}
        run: python scripts/run_ingestion_cron.py --only fundamentals
