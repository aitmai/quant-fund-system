# Phase 1 daily price ingestion (DESIGN.md §5, §7): backfill-then-maintenance
# for price_history against its own daily budget (independent of fundamentals
# — DESIGN.md §5's whole point is that one data type's budget/schedule never
# blocks the other). Runs on GitHub's free public runners, same pattern as
# the Phase 0 hello-world / keepalive workflows.
#
# Scheduled on its own (separate from fundamentals) because price ingestion
# is validated — provider fallback (Tiingo/yfinance) and request pacing
# (PRICE_REQUEST_DELAY_SECONDS, to avoid Yahoo throttling) are both in
# place. Fundamentals stays manual-trigger-only for now — see
# fundamentals_ingestion_cron.yml — until the FMP field-name mapping is
# confirmed against a live run.
name: daily-price-ingestion

on:
  schedule:
    # Hourly, not once/day (2026-07-14 change) — Tiingo (now the primary
    # provider, see ingestion_config.active_provider) caps at ~50
    # requests/hour on the free tier. The in-process circuit breaker in
    # provider_factory.py resets on every fresh cron run, so an hourly
    # cadence lets each run claim its own ~50-ticker Tiingo window rather
    # than burning through daily_budget in one shot and spending the
    # rest of the day failing against a dead yfinance fallback. Once the
    # backfill catches up, hourly runs just do cheap 1-day-delta
    # maintenance fetches — fine to leave hourly, or dial back later.
    #
    # Offset to :17 rather than :00 — GitHub's own docs warn scheduled
    # workflows can be delayed or dropped under load, and recommend
    # avoiding the top of the hour, since that's when the largest number
    # of other repos' cron jobs also fire.
    - cron: "17 * * * *"
  workflow_dispatch: {}

jobs:
  ingest-price:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run price ingestion
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          TIINGO_API_KEY: ${{ secrets.TIINGO_API_KEY }}
        run: python scripts/run_ingestion_cron.py --only price
